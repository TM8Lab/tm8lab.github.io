remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: air
locale: en
title: TM8 Lab
subtitle: Embedded intelligently
name: TM8 Lab
description: "Electronic modules for makers and engineers. Sensors, portable power supplies, and product documentation."
url: "https://www.tm8lab.nl"
baseurl: ""
repository: TM8Lab/tm8lab.github.io
logo: /assets/images/logo.jpg
search: true
breadcrumbs: true
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
exclude:
  - .local
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTENT-REVIEW.md
  - vendor
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
      related: false
footer:
  links:
    - label: Tindie
      icon: fas fa-shopping-bag
      url: https://www.tindie.com/stores/tm8lab/
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/TM8Lab/tm8lab.github.io
